name: Sync YouTube library

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert YOUTUBE_API_KEY is set
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "::error::YOUTUBE_API_KEY secret is not set. Add it at Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Fetch YouTube library
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/youtube.json; then
            echo "No changes to data/youtube.json"
            exit 0
          fi
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/youtube.json','utf8')).videos.length)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "chore: sync YouTube library ($count videos)"
          git push
